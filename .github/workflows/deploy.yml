name: Build and Deploy to DreamHost

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allow manual trigger

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build the project
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      # DreamHost's SSH occasionally times out (seen 2026-09-25), which used to
      # fail the whole deploy and leave a commit built but never published.
      # Two more attempts, spaced out, cover a transient outage; a genuine
      # credential or path error still fails all three and stops the workflow.
      - name: Deploy to DreamHost via SFTP
        id: deploy_site
        continue-on-error: true
        uses: burnett01/rsync-deployments@6.0.0
        with:
          switches: -avzr --delete
          path: dist/
          remote_path: /home/${{ secrets.DREAMHOST_USERNAME }}/public_html/
          remote_host: ${{ secrets.DREAMHOST_HOST }}
          remote_user: ${{ secrets.DREAMHOST_USERNAME }}
          remote_key: ${{ secrets.DREAMHOST_SSH_KEY }}
          remote_key_pass: ${{ secrets.DREAMHOST_SSH_PASSPHRASE }}

      - name: Wait before retrying the site deploy
        if: steps.deploy_site.outcome == 'failure'
        run: |
          echo "::warning::Site deploy failed (${{ steps.deploy_site.outcome }}); retrying in 60s"
          sleep 60

      - name: Deploy to DreamHost via SFTP (retry 1)
        id: deploy_site_retry1
        if: steps.deploy_site.outcome == 'failure'
        continue-on-error: true
        uses: burnett01/rsync-deployments@6.0.0
        with:
          switches: -avzr --delete
          path: dist/
          remote_path: /home/${{ secrets.DREAMHOST_USERNAME }}/public_html/
          remote_host: ${{ secrets.DREAMHOST_HOST }}
          remote_user: ${{ secrets.DREAMHOST_USERNAME }}
          remote_key: ${{ secrets.DREAMHOST_SSH_KEY }}
          remote_key_pass: ${{ secrets.DREAMHOST_SSH_PASSPHRASE }}

      - name: Wait before the final site deploy attempt
        if: steps.deploy_site.outcome == 'failure' && steps.deploy_site_retry1.outcome == 'failure'
        run: sleep 120

      - name: Deploy to DreamHost via SFTP (retry 2)
        id: deploy_site_retry2
        if: steps.deploy_site.outcome == 'failure' && steps.deploy_site_retry1.outcome == 'failure'
        uses: burnett01/rsync-deployments@6.0.0
        with:
          switches: -avzr --delete
          path: dist/
          remote_path: /home/${{ secrets.DREAMHOST_USERNAME }}/public_html/
          remote_host: ${{ secrets.DREAMHOST_HOST }}
          remote_user: ${{ secrets.DREAMHOST_USERNAME }}
          remote_key: ${{ secrets.DREAMHOST_SSH_KEY }}
          remote_key_pass: ${{ secrets.DREAMHOST_SSH_PASSPHRASE }}

      # macondo-private/config.php is gitignored (holds the Anthropic API key)
      # and is generated here from a GitHub secret, never committed to the repo.
      - name: Generate Macondo chat config.php
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          mkdir -p macondo-private
          {
            echo '<?php'
            echo "define('ANTHROPIC_API_KEY', '${ANTHROPIC_API_KEY}');"
          } > macondo-private/config.php

      # Deployed OUTSIDE public_html/ (no --delete, so it never touches the
      # webroot and never wipes the runtime rate-limit.json chat.php writes
      # on the server between deploys).
      - name: Deploy Macondo private config (outside webroot)
        id: deploy_macondo
        continue-on-error: true
        uses: burnett01/rsync-deployments@6.0.0
        with:
          switches: -avzr
          path: macondo-private/
          remote_path: /home/${{ secrets.DREAMHOST_USERNAME }}/macondo-private/
          remote_host: ${{ secrets.DREAMHOST_HOST }}
          remote_user: ${{ secrets.DREAMHOST_USERNAME }}
          remote_key: ${{ secrets.DREAMHOST_SSH_KEY }}
          remote_key_pass: ${{ secrets.DREAMHOST_SSH_PASSPHRASE }}

      - name: Retry Macondo private config deploy
        if: steps.deploy_macondo.outcome == 'failure'
        uses: burnett01/rsync-deployments@6.0.0
        with:
          switches: -avzr
          path: macondo-private/
          remote_path: /home/${{ secrets.DREAMHOST_USERNAME }}/macondo-private/
          remote_host: ${{ secrets.DREAMHOST_HOST }}
          remote_user: ${{ secrets.DREAMHOST_USERNAME }}
          remote_key: ${{ secrets.DREAMHOST_SSH_KEY }}
          remote_key_pass: ${{ secrets.DREAMHOST_SSH_PASSPHRASE }}

      - name: Deployment Success
        run: echo "✅ Deployed to 77rentals.com successfully!"
