<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Purple background -->
  <rect width="64" height="64" rx="10" fill="#4A1272"/>

  <!-- Gold house roof -->
  <polygon points="32,8 56,30 52,30 52,28 12,28 12,30 8,30" fill="#D4A017"/>
  <!-- Gold house body -->
  <rect x="14" y="28" width="36" height="22" fill="#D4A017"/>
  <!-- Gold window -->
  <rect x="27" y="32" width="10" height="10" rx="1" fill="#4A1272" opacity="0.6"/>
  <line x1="32" y1="32" x2="32" y2="42" stroke="#D4A017" stroke-width="1"/>
  <line x1="27" y1="37" x2="37" y2="37" stroke="#D4A017" stroke-width="1"/>

  <!-- White "77" text -->
  <text x="32" y="60" font-family="Arial Black, sans-serif" font-size="13" font-weight="900"
        fill="white" text-anchor="middle" letter-spacing="-1">77</text>
</svg>
